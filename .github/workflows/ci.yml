name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (core modules)
        run: npm run typecheck

      - name: Unit tests + CoolProp oracle grid
        run: npm test

      - name: Accuracy report vs CoolProp
        run: npm run analyze

      - name: Build (single-file bundle + PWA assets)
        run: npm run build

      - name: Sanity-check the bundle
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          # The stamped SW must not still carry the placeholder
          ! grep -q "__BUILD_VERSION__" dist/sw.js
          # Single-file promise: no external JS chunks
          ! ls dist/assets 2>/dev/null | grep -q "\.js$" || true

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end regression tests (hosted app + single file)
        run: npm run test:e2e

      - name: Committed shareable file matches a fresh build
        run: |
          # StreamHallPlanner.html is committed so Pages can serve it. If it
          # drifts from the source it was built from, the file people download
          # stops being the app people see — which has happened. `test:e2e`
          # rebuilds it, so any diff here means the commit is stale.
          git diff --exit-code -- StreamHallPlanner.html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: psychro-dist
          path: dist/
          retention-days: 14
