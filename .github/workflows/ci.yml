name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (core modules)
        run: npm run typecheck

      - name: Unit tests + CoolProp oracle grid
        run: npm test

      - name: Accuracy report vs CoolProp
        run: npm run analyze

      - name: Build (single-file bundle + PWA assets)
        run: npm run build

      - name: Sanity-check the bundle
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          # The stamped SW must not still carry the placeholder
          ! grep -q "__BUILD_VERSION__" dist/sw.js
          # Single-file promise: no external JS chunks
          ! ls dist/assets 2>/dev/null | grep -q "\.js$" || true

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Committed shareable file is a build of the current source
        run: |
          # StreamHallPlanner.html is committed (Pages serves the repo raw) and
          # is what people download. This catches an edit to src/ that was never
          # rebuilt into it. Byte equality can't be used: the bundle embeds the
          # build's git SHA, so a file committed at one commit never matches a
          # rebuild at a later one. The checker normalises that stamp only.
          cp StreamHallPlanner.html "$RUNNER_TEMP/committed.html"
          npm run shareable
          node scripts/check-shareable-fresh.mjs "$RUNNER_TEMP/committed.html" StreamHallPlanner.html

      - name: End-to-end regression tests (hosted app + single file)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: psychro-dist
          path: dist/
          retention-days: 14
