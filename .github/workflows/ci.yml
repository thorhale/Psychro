name: CI

# Trigger economics: `push: ['**']` PLUS `pull_request` ran the whole pipeline
# TWICE for every commit on a branch with an open PR — half the month's free
# Actions minutes went to duplicates. Push triggers only on main (the
# post-merge record); PRs get the pull_request run. A branch without a PR runs
# nothing, which is fine — nothing merges without a PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded commit's run is dead weight — cancel it when a newer one arrives.
# Runs on main are never cancelled: each merge's record stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Static analysis + unit/oracle/invariant suites ────────────────────────
  test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (core modules)
        run: npm run typecheck

      - name: Unit, CoolProp oracle, invariant and consistency suites
        run: npm test

      - name: CDU sim invariant sweep
        # The imported tool ships with its own oracle: 124,488 operating points
        # asserting energy balance, no temperature crossing, and that the page's
        # constants have not drifted from the test core. It is excluded from
        # eslint on purpose (imported byte-for-byte), so THIS is its gate.
        run: npm run validate:cdu

      - name: Accuracy report vs CoolProp
        # Printed in the log so any accuracy drift is visible in the PR without
        # having to reproduce it locally.
        run: npm run analyze

  # ── Build + artifact integrity ────────────────────────────────────────────
  build:
    name: Build and verify bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (vite build + single-file download into dist/)
        # `shareable`, not plain `build`: a deployable dist/ includes
        # StreamHallPlanner.html — the app's own download link points at it —
        # and only make-shareable produces that file. The committed copy is
        # saved aside first so the freshness check below can compare.
        run: |
          cp StreamHallPlanner.html "$RUNNER_TEMP/committed.html"
          npm run shareable

      - name: Committed shareable file is a build of the current source
        run: |
          # StreamHallPlanner.html is committed (it is the app's download and
          # the file:// E2E artifact). This catches an edit to src/ that was
          # never rebuilt into it. Byte equality can't be used: the bundle
          # embeds the build's git SHA, so a file committed at one commit never
          # matches a rebuild at a later one. The checker normalises that only.
          node scripts/check-shareable-fresh.mjs "$RUNNER_TEMP/committed.html" StreamHallPlanner.html

      - name: Verify bundle
        # Asserts the single-file promise, that no PWA asset got fingerprinted,
        # that every service-worker precache entry exists, and that dist/
        # carries the download the deployed app links to.
        run: npm run verify:bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: psychro-dist
          path: dist/
          retention-days: 14

  # ── End-to-end against the real artifacts ─────────────────────────────────
  # Three surfaces, one job: the raw module tree Pages serves, the built
  # single-file dist/, and StreamHallPlanner.html opened over file://.
  e2e:
    name: E2E and visual regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download bundle
        # E2E runs against the exact artifact the build job produced, not a
        # rebuild — so what is tested is what would ship.
        uses: actions/download-artifact@v4
        with:
          name: psychro-dist
          path: dist/

      - name: Run E2E and visual tests
        # `e2e`, not `test:e2e`: the dist/ under test is the one downloaded
        # above, and StreamHallPlanner.html is the committed download, already
        # proven fresh by the build job. Rebuilding either here would test
        # something other than what ships.
        run: npm run e2e

      - name: Upload failure diffs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 14
