name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # ── Static analysis + unit/oracle/invariant suites ────────────────────────
  test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (core modules)
        run: npm run typecheck

      - name: Unit, CoolProp oracle, invariant and consistency suites
        run: npm test

      - name: Accuracy report vs CoolProp
        # Printed in the log so any accuracy drift is visible in the PR without
        # having to reproduce it locally.
        run: npm run analyze

  # ── Build + artifact integrity ────────────────────────────────────────────
  build:
    name: Build and verify bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify bundle
        # Asserts the single-file promise, that no PWA asset got fingerprinted,
        # and that every service-worker precache entry actually exists.
        run: npm run verify:bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: psychro-dist
          path: dist/
          retention-days: 14

  # ── End-to-end against the real artifact ──────────────────────────────────
  e2e:
    name: E2E and visual regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download bundle
        # E2E runs against the exact artifact the build job produced, not a
        # rebuild — so what is tested is what would ship.
        uses: actions/download-artifact@v4
        with:
          name: psychro-dist
          path: dist/

      - name: Run E2E and visual tests
        run: npm run e2e

      - name: Upload failure diffs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 14
